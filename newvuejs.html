<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <title>Carrinho de compras</title>

    <style>
        .container {
            max-width: 768px;
        }
    </style>
</head>

<body>

    <div id="app">
        <div class="container mt-5">
            <h2 class="text-center mb-5">Carrinho de compra</h2>
            <cart :products="products" @delete="deleteProduct"></cart>
        </div>
    </div>

    <template id="cart">
        <div class="card shadow">
            <div v-for="product in products" :key="product.id">
                <product :product="product" @delete="deleteProduct"></product>
                <hr>
            </div>

            <div class="card-footer d-flex align-items-center justify-content-between">
                <a href="">
                    Continuar comprando
                </a>

                <div>
                    <small class="text-muted">Total:</small> <span class="fs-5">R${{total}}</span>
                </div>
            </div>
        </div>
    </template>

    <template id="product">
        <div class="d-flex align-items-center m-3">
                <div class="d-flex align-items-center">
                    <div class="me-3">
                        <img src="https://placehold.co/72" alt="" class="rounded-circle">
                    </div>

                    <div class="ml-3">
                        <h4 class="mb-0">{{product.name}}</h4>
                        <span class="text-muted fs-6">{{product.id}}</span>
                    </div>
                </div>

                <div class="ms-auto d-flex align-items-center">
                    <div class="d-flex align-items-center" style="width: 120px">
                        <div class="input-group">
                            <button @click="remove()" :disabled="product.qty <= 1" class="btn btn-outline-secondary" type="button" id="button-addon1">-</button>
                            <input :value="product.qty" readonly type="text" value="1" class="form-control text-center">
                            <button @click="add()" class="btn btn-outline-secondary" type="button" id="button-addon1">+</button>
                        </div>
                    </div>

                    <div class="d-flex align-items-center mx-4">
                        R${{total}}
                    </div>

                    <div class="d-flex align-items-center">
                        <button @click="deleteProduct()" class="btn btn-sm btn-outline-danger">
                            <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
    </template>


    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp, ref } = Vue

        const app = createApp({
            data() {
                return {
                    products:[
                        {id: 1, name: 'Produto A', amount: 10.50, qty: 1},
                        {id: 2, name: 'Produto B', amount: 5.80, qty: 1},
                        {id: 3, name: 'Produto C', amount: 5, qty: 1},
                    ],
                };
            },
            methods: {
                deleteProduct(product) {
                    const idx = this.products.findIndex(o => o.id === product.id)
                    if(idx >= 0) {
                        this.products.splice(idx, 1);
                    }
                    
                },
            }
        });

        app.component('cart', {
            template: '#cart',
            props: {
                products: {
                    products: {
                        type:Array,
                        default: () => [],
                    }
                }
            },

            computed: {
                total() {
                    return this.products.reduce((total, item) => {
                        total += item.qty * item.amount;
                        return total;
                    }, 0);
                },
            },

            methods: {
                deleteProduct(product){
                    
                    this.$emit('delete', product);
                },
            }
        });

        app.component('product', {
            template:'#product',
            props: {
                product:{
                    type: Object,
                    default: () => ({}),

                }
            },
            data() {
                return {
                    
                }
            },

            computed: {
                total() {
                    return this.product.amount * this.product.qty;
                }
            },

            methods: {
                add(){
                    this.product.qty++;
                },

                remove(){
                    if(this.product.qty <=1) {
                        return;
                    }
                    this.product.qty--;
                },
                deleteProduct(){
                    this.$emit('delete', this.product);
                },
            }
        });


        const mnt = app.mount('#app');

    </script>
</body>

</html>
